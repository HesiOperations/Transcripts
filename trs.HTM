<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HESI Transcripts Fulfillment Tracker</title>
<style>
  :root {
    --navy: #1a2b4c;
    --blue: #2f6fed;
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e2e6ee;
    --text: #1f2430;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 20px 28px;
  }
  header h1 { margin: 0; font-size: 32px; font-weight: 400; font-family: Georgia, 'Times New Roman', serif; }
  header p { margin: 4px 0 0; font-size: 13px; color: #b9c3dc; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 14px;
  }
  #search {
    flex: 1;
    min-width: 220px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .btn {
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  .btn:hover { background: #eef1f7; }
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .tab {
    padding: 9px 14px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .tab .count {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 7px;
    border-radius: 10px;
    background: #eef1f7;
    color: var(--muted);
    font-size: 11px;
  }
  .tab.active {
    color: var(--blue);
    background: var(--card);
    border-color: var(--border);
    border-bottom-color: var(--card);
    margin-bottom: -1px;
  }
  .tab.active .count { background: var(--blue); color: #fff; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0 8px 8px 8px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    padding: 11px 14px;
    background: #f8f9fc;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    color: var(--navy);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { background: #eef1f7; }
  thead th.sorted::after { content: " " attr(data-dir); font-size: 10px; color: var(--blue); }
  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid #eef0f5;
    vertical-align: top;
  }
  tbody tr:hover { background: #f8f9fc; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  mark { background: #fff2a8; padding: 0 1px; border-radius: 2px; }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 8px;
  }
  .pager button {
    padding: 5px 10px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    margin-left: 4px;
  }
  .pager button:disabled { opacity: 0.4; cursor: default; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .updated { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>HESI Transcripts Fulfillment Tracker</h1>
</header>
<div class="wrap">
  <div class="toolbar">
    <input id="search" type="text" placeholder="Search by order #, name, or email...">
    <button class="btn" id="exportBtn">Export CSV</button>
    <button class="btn" id="clearBtn">Clear filters</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th data-key="id">Order ID</th>
          <th data-key="name">Name</th>
          <th data-key="email">Email</th>
          <th data-key="form">Transcript Form</th>
          <th data-key="received">Order Date Received</th>
          <th data-key="status">Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">No matching orders.</div>
    <div class="footer">
      <div id="rowInfo"></div>
      <div class="pager">
        <button id="prevBtn">&larr; Prev</button>
        <span id="pageInfo"></span>
        <button id="nextBtn">Next &rarr;</button>
      </div>
    </div>
  </div>
  <div class="updated" id="updatedLine"></div>
</div>

const TABS = ["All", "Completed", "In Progress", "Awaiting Transcript Form", "Pending", "Incomplete"];
const STATUS_COLORS = {"Completed": "#00c875", "In Progress": "#fdab3d", "Awaiting Transcript Form": "#579bfc", "Pending": "#c4c4c4", "Incomplete - Follow-up Sent (1st)": "#ffcb00", "Incomplete - Follow-up Sent (2nd)": "#ff642e", "Incomplete - Follow-up Sent (3rd)": "#e2445c", "Incomplete - Pending Follow-up": "#bb3354", "Incomplete": "#e2445c"};
const TAB_STATUS_MAP = {"Completed": ["Completed"], "In Progress": ["In Progress"], "Awaiting Transcript Form": ["Awaiting Transcript Form"], "Pending": ["Pending"], "Incomplete": ["Incomplete - Follow-up Sent (1st)", "Incomplete - Follow-up Sent (2nd)", "Incomplete - Follow-up Sent (3rd)", "Incomplete - Pending Follow-up"]};

const state = {
  tab: "All",
  search: "",
  sortKey: "received",
  sortDir: "desc",
  page: 1,
  pageSize: 50,
};

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function highlight(text, term) {
  const t = escapeHtml(text ?? "");
  if (!term) return t;
  const idx = t.toLowerCase().indexOf(term.toLowerCase());
  if (idx === -1) return t;
  return t.slice(0, idx) + "<mark>" + t.slice(idx, idx + term.length) + "</mark>" + t.slice(idx + term.length);
}

function rowsForTab(tab) {
  if (tab === "All") return DATA;
  const statuses = TAB_STATUS_MAP[tab] || [tab];
  return DATA.filter(r => statuses.includes(r.status));
}

function countForTab(tab) {
  return rowsForTab(tab).length;
}

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = TABS.map(t => {
    const active = t === state.tab ? "active" : "";
    return `<div class="tab ${active}" data-tab="${escapeHtml(t)}">${escapeHtml(t)}<span class="count">${countForTab(t)}</span></div>`;
  }).join("");
  el.querySelectorAll(".tab").forEach(node => {
    node.addEventListener("click", () => {
      state.tab = node.getAttribute("data-tab");
      state.page = 1;
      render();
    });
  });
}

function getFiltered() {
  let rows = rowsForTab(state.tab).slice();
  const term = state.search.trim().toLowerCase();
  if (term) {
    rows = rows.filter(r =>
      (r.id || "").toLowerCase().includes(term) ||
      (r.name || "").toLowerCase().includes(term) ||
      (r.email || "").toLowerCase().includes(term)
    );
  }
  rows.sort((a, b) => {
    const av = (a[state.sortKey] || "").toString();
    const bv = (b[state.sortKey] || "").toString();
    const cmp = av.localeCompare(bv, undefined, {numeric: true});
    return state.sortDir === "asc" ? cmp : -cmp;
  });
  return rows;
}

function render() {
  renderTabs();
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
  state.page = Math.min(state.page, totalPages);
  const startIdx = (state.page - 1) * state.pageSize;
  const pageRows = filtered.slice(startIdx, startIdx + state.pageSize);
  const term = state.search.trim();

  const tbody = document.getElementById("tbody");
  const emptyMsg = document.getElementById("emptyMsg");
  if (pageRows.length === 0) {
    tbody.innerHTML = "";
    emptyMsg.style.display = "block";
  } else {
    emptyMsg.style.display = "none";
    tbody.innerHTML = pageRows.map(r => {
      const color = STATUS_COLORS[r.status] || "#6b7280";
      return `<tr>
        <td>${highlight(r.id, term)}</td>
        <td>${highlight(r.name, term)}</td>
        <td>${highlight(r.email, term)}</td>
        <td>${escapeHtml(r.form || "—")}</td>
        <td>${escapeHtml(r.received || "—")}</td>
        <td><span class="badge" style="background:${color}">${escapeHtml(r.status)}</span></td>
      </tr>`;
    }).join("");
  }

  document.querySelectorAll("thead th").forEach(th => {
    th.classList.remove("sorted");
    th.removeAttribute("data-dir");
    if (th.getAttribute("data-key") === state.sortKey) {
      th.classList.add("sorted");
      th.setAttribute("data-dir", state.sortDir === "asc" ? "▲" : "▼");
    }
  });

  document.getElementById("rowInfo").textContent =
    `Showing ${filtered.length === 0 ? 0 : startIdx + 1}–${Math.min(startIdx + state.pageSize, filtered.length)} of ${filtered.length} (of ${DATA.length} total)`;
  document.getElementById("pageInfo").textContent = `Page ${state.page} of ${totalPages}`;
  document.getElementById("prevBtn").disabled = state.page <= 1;
  document.getElementById("nextBtn").disabled = state.page >= totalPages;
}

document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.getAttribute("data-key");
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    } else {
      state.sortKey = key;
      state.sortDir = "asc";
    }
    render();
  });
});

document.getElementById("search").addEventListener("input", (e) => {
  state.search = e.target.value;
  state.page = 1;
  render();
});

document.getElementById("clearBtn").addEventListener("click", () => {
  state.tab = "All";
  state.search = "";
  document.getElementById("search").value = "";
  state.page = 1;
  render();
});

document.getElementById("prevBtn").addEventListener("click", () => { state.page--; render(); });
document.getElementById("nextBtn").addEventListener("click", () => { state.page++; render(); });

document.getElementById("exportBtn").addEventListener("click", () => {
  const rows = getFiltered();
  const header = ["Order ID","Name","Email","Transcript Form","Order Date Received","Status"];
  const lines = [header.join(",")];
  rows.forEach(r => {
    const line = [r.id, r.name, r.email, r.form, r.received, r.status]
      .map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",");
    lines.push(line);
  });
  const blob = new Blob([lines.join("\n")], {type: "text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `hesi_transcript_${state.tab.replace(/[^a-z0-9]+/gi,"_")}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("updatedLine").textContent = "Generated " + new Date().toISOString().slice(0,16).replace("T"," ") + " UTC — " + DATA.length + " records";

render();
</script>
</body>
</html>
