<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HESI Transcripts Fulfillment Tracker</title>
<style>
  :root {
    --navy: #1a2b4c;
    --blue: #2f6fed;
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e2e6ee;
    --text: #1f2430;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 20px 28px;
  }
  header h1 { margin: 0; font-size: 32px; font-weight: 400; font-family: Georgia, 'Times New Roman', serif; }
  header p { margin: 4px 0 0; font-size: 13px; color: #b9c3dc; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 14px;
  }
  #search {
    flex: 1;
    min-width: 220px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .btn {
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  .btn:hover { background: #eef1f7; }
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .tab {
    padding: 9px 14px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .tab .count {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 7px;
    border-radius: 10px;
    background: #eef1f7;
    color: var(--muted);
    font-size: 11px;
  }
  .tab.active {
    color: var(--blue);
    background: var(--card);
    border-color: var(--border);
    border-bottom-color: var(--card);
    margin-bottom: -1px;
  }
  .tab.active .count { background: var(--blue); color: #fff; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0 8px 8px 8px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    padding: 11px 14px;
    background: #f8f9fc;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    color: var(--navy);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { background: #eef1f7; }
  thead th.sorted::after { content: " " attr(data-dir); font-size: 10px; color: var(--blue); }
  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid #eef0f5;
    vertical-align: top;
  }
  tbody tr:hover { background: #f8f9fc; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  mark { background: #fff2a8; padding: 0 1px; border-radius: 2px; }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 8px;
  }
  .pager button {
    padding: 5px 10px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    margin-left: 4px;
  }
  .pager button:disabled { opacity: 0.4; cursor: default; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .updated { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>HESI Transcripts Fulfillment Tracker</h1>
</header>
<div class="wrap">
  <div class="toolbar">
    <input id="search" type="text" placeholder="Search by order #, name, or email...">
    <button class="btn" id="exportBtn">Export CSV</button>
    <button class="btn" id="clearBtn">Clear filters</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th data-key="id">Order ID</th>
          <th data-key="name">Name</th>
          <th data-key="email">Email</th>
          <th data-key="form">Transcript Form</th>
          <th data-key="received">Order Date Received</th>
          <th data-key="status">Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">No matching orders.</div>
    <div class="footer">
      <div id="rowInfo"></div>
      <div class="pager">
        <button id="prevBtn">&larr; Prev</button>
        <span id="pageInfo"></span>
        <button id="nextBtn">Next &rarr;</button>
      </div>
    </div>
  </div>
  <div class="updated" id="updatedLine"></div>
</div>
